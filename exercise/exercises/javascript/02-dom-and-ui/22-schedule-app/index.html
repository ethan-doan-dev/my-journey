<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Enterprise-grade Schedule & Productivity Workspace" />
  <title>Workspace | Enterprise Schedule</title>
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & VARIABLES (CSS System)
       ========================================================================== */
    :root {
      /* Base Colors */
      --brand-50: #eef2ff;
      --brand-100: #e0e7ff;
      --brand-500: #6366f1;
      --brand-600: #4f46e5;
      --brand-900: #312e81;
      
      --danger-500: #ef4444;
      --danger-50: #fef2f2;
      --success-500: #10b981;

      /* UI Tokens (Light Theme) */
      --bg-app: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-hover: #f1f5f9;
      --bg-glass: rgba(255, 255, 255, 0.85);
      
      --border-light: #e2e8f0;
      --border-strong: #cbd5e1;
      --border-focus: var(--brand-500);
      
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      
      /* Shadows & Elevations */
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-modal: 0 25px 50px -12px rgb(0 0 0 / 0.25);
      --ring-focus: 0 0 0 3px rgba(99, 102, 241, 0.3);

      /* Spacing & Radii */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      
      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-spring: 300ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    [data-theme="dark"] {
      --bg-app: #020617;
      --bg-surface: #0f172a;
      --bg-surface-hover: #1e293b;
      --bg-glass: rgba(15, 23, 42, 0.85);
      
      --border-light: #1e293b;
      --border-strong: #334155;
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.6);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.7);
      --shadow-modal: 0 25px 50px -12px rgb(0 0 0 / 0.9);
      
      --brand-50: rgba(99, 102, 241, 0.1);
    }

    /* ==========================================================================
       2. RESET & BASE
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color var(--transition-fast), color var(--transition-fast);
      overflow-x: hidden;
    }

    /* Accessibility Focus States */
    :focus-visible {
      outline: none;
      box-shadow: var(--ring-focus);
      border-color: var(--border-focus);
      border-radius: var(--radius-sm);
    }

    button, input, textarea {
      font-family: inherit;
      border: none;
      background: none;
    }

    button {
      cursor: pointer;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--radius-full); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

    /* ==========================================================================
       3. LAYOUT & COMPONENTS
       ========================================================================== */
    .app-layout {
      display: flex;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* --- Sidebar (Glassmorphism) --- */
    .sidebar {
      position: fixed;
      z-index: 40;
      top: 0; left: 0; bottom: 0;
      width: 280px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform var(--transition-fast);
      box-shadow: var(--shadow-lg);
    }

    .sidebar[aria-expanded="true"] {
      transform: translateX(0);
    }

    .sidebar__header {
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 24px;
      height: 24px;
      background: var(--brand-600);
      border-radius: 6px;
      display: grid;
      place-items: center;
      box-shadow: 0 0 12px var(--brand-50);
    }
    .brand-logo::after {
      content: '';
      width: 8px; height: 8px;
      background: #fff;
      border-radius: 2px;
    }
    .brand-title {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .nav-group { padding: 0 16px; margin-bottom: 24px; }
    .nav-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0 8px;
      margin-bottom: 8px;
    }
    
    .nav-list { list-style: none; display: grid; gap: 4px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      transition: var(--transition-fast);
    }
    .nav-item:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
    }
    .nav-item[aria-selected="true"] {
      background: var(--brand-50);
      color: var(--brand-600);
    }

    /* --- Pomodoro Widget --- */
    .pomodoro-widget {
      margin: 0 16px;
      padding: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .pomodoro-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 36px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 16px;
      line-height: 1;
    }
    .btn-group { display: flex; gap: 8px; }
    .btn {
      flex: 1;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      transition: var(--transition-fast);
    }
    .btn--primary {
      background: var(--brand-600);
      color: #fff;
    }
    .btn--primary:hover { background: var(--brand-500); }
    .btn--secondary {
      background: var(--bg-surface-hover);
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
    }
    .btn--secondary:hover { color: var(--text-primary); border-color: var(--border-strong); }

    /* --- Overlay --- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-fast);
    }
    .overlay.active { opacity: 1; pointer-events: auto; }

    /* --- Main Content Area --- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding: 0 24px;
    }

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .icon-btn {
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 18px;
      transition: var(--transition-fast);
    }
    .icon-btn:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
    
    .view-title { font-size: 20px; font-weight: 700; }
    
    .clock-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px; font-weight: 600;
      background: var(--brand-50);
      color: var(--brand-600);
      padding: 6px 12px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    /* --- View Containers --- */
    .view-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 24px;
      display: none;
    }
    .view-container.active { display: block; }

    /* --- Schedule Bento Grid --- */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      align-items: start;
    }
    
    @media (min-width: 1440px) {
      .bento-grid { grid-template-columns: repeat(7, 1fr); gap: 16px; }
      .bento-grid > * { min-width: 0; }
    }

    .day-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      height: 600px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition-fast), transform var(--transition-spring);
    }
    .day-card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }

    .day-card__header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .day-name { font-weight: 700; font-size: 15px; }

    .day-card__body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
      overflow: hidden;
    }

    /* --- Task System --- */
    .task-input-wrapper { display: flex; gap: 8px; }
    .input-base {
      flex: 1;
      height: 42px;
      padding: 0 16px;
      background: var(--bg-surface-hover);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      font-size: 14px;
      color: var(--text-primary);
      transition: var(--transition-fast);
    }
    .input-base:focus {
      background: var(--bg-surface);
      border-color: var(--border-focus);
      box-shadow: var(--ring-focus);
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      flex: 1;
    }
    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      transition: var(--transition-fast);
      animation: slideIn 0.2s ease-out;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    
    .task-item:hover { border-color: var(--border-strong); }
    .task-item.is-completed { opacity: 0.6; }
    .task-item.is-completed .task-text { text-decoration: line-through; color: var(--text-tertiary); }

    .custom-checkbox {
      appearance: none;
      width: 20px; height: 20px;
      border: 2px solid var(--border-strong);
      border-radius: 6px;
      background: var(--bg-surface);
      cursor: pointer;
      display: grid;
      place-content: center;
      margin-top: 2px;
      flex-shrink: 0;
      transition: var(--transition-fast);
    }
    .custom-checkbox:checked {
      background: var(--brand-600);
      border-color: var(--brand-600);
    }
    .custom-checkbox:checked::before {
      content: "";
      width: 10px; height: 5px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg) translate(2px, -2px);
    }

    .task-text {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      word-break: break-word;
      transition: color 0.2s;
    }

    .btn-delete {
      color: var(--text-tertiary);
      font-size: 18px;
      width: 24px; height: 24px;
      border-radius: 4px;
      display: grid; place-items: center;
      opacity: 0;
      transition: var(--transition-fast);
    }
    .task-item:hover .btn-delete { opacity: 1; }
    .btn-delete:hover { background: var(--danger-50); color: var(--danger-500); }

    .workspace-area {
      border-top: 1px dashed var(--border-light);
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .workspace-area h4 { font-size: 12px; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 8px; }
    .workspace-textarea {
      flex: 1;
      resize: none;
      width: 100%;
      padding: 12px;
      background: var(--bg-surface-hover);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      font-size: 13px;
      color: var(--text-primary);
    }
    .workspace-textarea:focus { background: var(--bg-surface); border-color: var(--border-focus); box-shadow: var(--ring-focus); }

    /* --- Modal Expansion --- */
    .day-card.is-expanded {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 90vw; max-width: 800px; height: 85vh;
      z-index: 50;
      box-shadow: var(--shadow-modal);
    }

    /* --- Editor View (Notes) --- */
    .editor-container {
      max-width: 900px;
      margin: 0 auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .editor-header { display: flex; justify-content: space-between; align-items: center; }
    .save-status { font-size: 13px; font-weight: 600; color: var(--text-tertiary); display: flex; align-items: center; gap: 6px; }
    .save-status.is-saved { color: var(--success-500); }
    .save-status.is-saved::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--success-500); }
    
    .editor-textarea {
      flex: 1;
      width: 100%;
      padding: 24px;
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      font-size: 15px;
      line-height: 1.7;
      resize: none;
      box-shadow: var(--shadow-sm);
    }
    .editor-textarea:focus { border-color: var(--border-focus); box-shadow: var(--ring-focus); }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      .main-content { padding: 0 16px; }
      .bento-grid { grid-template-columns: 1fr; }
      .day-card { height: auto; min-height: 500px; }
      .topbar-right .clock-badge { display: none; }
    }
  </style>
</head>
<body>

  <!-- Sidebar Component -->
  <aside class="sidebar" id="app-sidebar" aria-expanded="false">
    <div class="sidebar__header">
      <div class="brand-logo"></div>
      <span class="brand-title">Enterprise</span>
    </div>
    
    <nav class="nav-group">
      <div class="nav-label">Workspace</div>
      <ul class="nav-list" role="tablist">
        <li>
          <button class="nav-item" role="tab" aria-selected="true" data-target="view-schedule" style="width: 100%; border: none; text-align: left;">
            📅 Master Schedule
          </button>
        </li>
        <li>
          <button class="nav-item" role="tab" aria-selected="false" data-target="view-notes" style="width: 100%; border: none; text-align: left;">
            📝 Engineering Notes
          </button>
        </li>
      </ul>
    </nav>

    <div class="nav-group" style="margin-top: auto;">
      <div class="nav-label">Focus Protocol</div>
      <div class="pomodoro-widget">
        <div class="pomodoro-time" id="pomo-display">25:00</div>
        <div class="btn-group">
          <button class="btn btn--primary" id="pomo-toggle">Start</button>
          <button class="btn btn--secondary" id="pomo-reset">Reset</button>
        </div>
      </div>
    </div>
  </aside>

  <div class="overlay" id="app-overlay"></div>

  <!-- Main Application Area -->
  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="btn-menu" aria-label="Toggle Sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <h1 class="view-title" id="topbar-title">Master Schedule</h1>
      </div>
      <div class="topbar-right" style="display: flex; gap: 12px; align-items: center;">
        <div class="clock-badge" id="live-clock">00:00:00</div>
        <button class="icon-btn" id="btn-theme" aria-label="Toggle Theme">🌓</button>
      </div>
    </header>

    <!-- Route: Schedule View -->
    <section class="view-container active" id="view-schedule">
      <div class="bento-grid" id="schedule-grid">
        <!-- Rendered by JS to keep HTML DRY -->
      </div>
    </section>

    <!-- Route: Notes View -->
    <section class="view-container" id="view-notes">
      <div class="editor-container">
        <div class="editor-header">
          <h2 class="view-title" style="font-size: 16px;">Technical Documentation</h2>
          <span class="save-status is-saved" id="notes-status">Synced</span>
        </div>
        <textarea class="editor-textarea" id="notes-editor" placeholder="Write architectural decisions, API structures, or C# concepts here..."></textarea>
      </div>
    </section>

  </main>

  <script>
    /**
     * ==========================================================================
     * ENTERPRISE APP ARCHITECTURE (Vanilla JS Modular Pattern)
     * ==========================================================================
     */

    // --- 1. CONFIGURATION & CONSTANTS ---
    const CONFIG = {
      APP_KEY: 'Enterprise_App_State_v1',
      DAYS: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'],
      DEFAULT_POMODORO: 25 * 60
    };

    // --- 2. UTILITIES (Performance & Security) ---
    const Utils = {
      // Debounce: Prevents firing intensive functions (like saving to DB/Storage) too frequently
      debounce: (func, delay) => {
        let timeout;
        return (...args) => {
          clearTimeout(timeout);
          timeout = setTimeout(() => func(...args), delay);
        };
      },
      
      // Generate Unique ID (UUID-like) for entities
      generateId: () => Math.random().toString(36).substring(2, 11),
      
      // Prevent XSS attacks by escaping HTML chars (Crucial for SaaS)
      escapeHTML: (str) => {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      },
      
      // Format seconds into MM:SS
      formatTime: (seconds) => {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      }
    };

    // --- 3. STATE MANAGEMENT (Centralized Store) ---
    class Store {
      constructor(key) {
        this.key = key;
        this.state = this.load() || this.getInitialState();
      }

      getInitialState() {
        const state = { schedule: {}, notes: "", theme: "light" };
        CONFIG.DAYS.forEach(day => {
          state.schedule[day] = { tasks: [], workspace: "" };
        });
        return state;
      }

      load() {
        try {
          const data = localStorage.getItem(this.key);
          return data ? JSON.parse(data) : null;
        } catch (e) {
          console.error("Storage read error", e);
          return null;
        }
      }

      save() {
        try {
          localStorage.setItem(this.key, JSON.stringify(this.state));
        } catch (e) {
          console.error("Storage write error - Quota exceeded?", e);
        }
      }
    }

    // --- 4. COMPONENTS ---

    // Pomodoro Timer Controller
    class PomodoroTimer {
      constructor(displayEl, toggleBtn, resetBtn) {
        this.display = displayEl;
        this.toggleBtn = toggleBtn;
        this.resetBtn = resetBtn;
        this.timeLeft = CONFIG.DEFAULT_POMODORO;
        this.interval = null;
        this.isRunning = false;

        this.bindEvents();
        this.updateUI();
      }

      bindEvents() {
        this.toggleBtn.addEventListener('click', () => this.toggle());
        this.resetBtn.addEventListener('click', () => this.reset());
      }

      toggle() {
        if (this.isRunning) {
          clearInterval(this.interval);
          this.toggleBtn.textContent = 'Start';
        } else {
          this.toggleBtn.textContent = 'Pause';
          this.interval = setInterval(() => this.tick(), 1000);
        }
        this.isRunning = !this.isRunning;
      }

      tick() {
        if (this.timeLeft > 0) {
          this.timeLeft--;
          this.updateUI();
        } else {
          this.reset();
          alert("Focus session completed!"); // Replace with Native Notification in real SaaS
        }
      }

      reset() {
        clearInterval(this.interval);
        this.isRunning = false;
        this.timeLeft = CONFIG.DEFAULT_POMODORO;
        this.toggleBtn.textContent = 'Start';
        this.updateUI();
      }

      updateUI() {
        this.display.textContent = Utils.formatTime(this.timeLeft);
      }
    }

    // Schedule View Controller
    class ScheduleManager {
      constructor(store) {
        this.store = store;
        this.container = document.getElementById('schedule-grid');
        this.renderGrid();
        this.bindGlobalEvents();
      }

      renderGrid() {
        // Using DocumentFragment for performance batch DOM insertion
        const fragment = document.createDocumentFragment();
        
        CONFIG.DAYS.forEach(day => {
          const dayData = this.store.state.schedule[day];
          
          const col = document.createElement('div');
          col.className = 'day-card';
          col.dataset.day = day;
          
          // Using strict text binding or semantic HTML structure to prevent XSS
          col.innerHTML = `
            <div class="day-card__header">
              <span class="day-name">${day}</span>
              <button class="icon-btn btn-expand" style="width:28px; height:28px;" aria-label="Expand">⛶</button>
            </div>
            <div class="day-card__body">
              <div class="task-input-wrapper">
                <input type="text" class="input-base task-input" placeholder="Add task (Press Enter)..." aria-label="New task">
                <button class="icon-btn btn-add" style="background:var(--brand-600); color:white; border:none;" aria-label="Add">+</button>
              </div>
              <ul class="task-list">
                ${this.renderTasksHTML(dayData.tasks)}
              </ul>
              <div class="workspace-area">
                <h4>Workspace Notes</h4>
                <textarea class="workspace-textarea">${Utils.escapeHTML(dayData.workspace)}</textarea>
              </div>
            </div>
          `;
          fragment.appendChild(col);
        });

        this.container.appendChild(fragment);
      }

      renderTasksHTML(tasks) {
        return tasks.map(task => `
          <li class="task-item ${task.completed ? 'is-completed' : ''}" data-id="${task.id}">
            <input type="checkbox" class="custom-checkbox" ${task.completed ? 'checked' : ''} aria-label="Mark done">
            <span class="task-text">${Utils.escapeHTML(task.text)}</span>
            <button class="btn-delete" aria-label="Delete">×</button>
          </li>
        `).join('');
      }

      // Event Delegation: One listener on container instead of hundreds on individual elements
      bindGlobalEvents() {
        this.container.addEventListener('click', (e) => {
          const dayCard = e.target.closest('.day-card');
          if (!dayCard) return;
          const day = dayCard.dataset.day;

          // Handle Expand
          if (e.target.closest('.btn-expand')) {
            dayCard.classList.toggle('is-expanded');
            document.getElementById('app-overlay').classList.toggle('active');
            e.target.textContent = dayCard.classList.contains('is-expanded') ? '×' : '⛶';
          }

          // Handle Add Button
          if (e.target.closest('.btn-add')) {
            this.addTask(dayCard, day);
          }

          // Handle Delete
          if (e.target.closest('.btn-delete')) {
            const taskItem = e.target.closest('.task-item');
            this.deleteTask(day, taskItem.dataset.id);
            taskItem.remove();
          }

          // Handle Checkbox
          if (e.target.classList.contains('custom-checkbox')) {
            const taskItem = e.target.closest('.task-item');
            const isChecked = e.target.checked;
            this.toggleTask(day, taskItem.dataset.id, isChecked);
            taskItem.classList.toggle('is-completed', isChecked);
          }
        });

        // Handle Input Enter Key
        this.container.addEventListener('keydown', (e) => {
          if (e.target.classList.contains('task-input') && e.key === 'Enter') {
            const dayCard = e.target.closest('.day-card');
            this.addTask(dayCard, dayCard.dataset.day);
          }
        });

        // Debounced Input for Workspace Textareas
        const saveWorkspace = Utils.debounce((day, text) => {
          this.store.state.schedule[day].workspace = text;
          this.store.save();
        }, 500);

        this.container.addEventListener('input', (e) => {
          if (e.target.classList.contains('workspace-textarea')) {
            const day = e.target.closest('.day-card').dataset.day;
            saveWorkspace(day, e.target.value);
          }
        });
      }

      addTask(dayCard, day) {
        const input = dayCard.querySelector('.task-input');
        const text = input.value.trim();
        if (!text) return;

        const newTask = { id: Utils.generateId(), text, completed: false };
        this.store.state.schedule[day].tasks.push(newTask);
        this.store.save();

        const taskList = dayCard.querySelector('.task-list');
        taskList.insertAdjacentHTML('beforeend', this.renderTasksHTML([newTask]));
        
        input.value = '';
        input.focus();
      }

      deleteTask(day, id) {
        this.store.state.schedule[day].tasks = this.store.state.schedule[day].tasks.filter(t => t.id !== id);
        this.store.save();
      }

      toggleTask(day, id, completed) {
        const task = this.store.state.schedule[day].tasks.find(t => t.id === id);
        if (task) {
          task.completed = completed;
          this.store.save();
        }
      }
    }

    // --- 5. APP ORCHESTRATOR ---
    class App {
      constructor() {
        this.store = new Store(CONFIG.APP_KEY);
        this.initUI();
        this.bindEvents();
        
        // Initialize Components
        new ScheduleManager(this.store);
        new PomodoroTimer(
          document.getElementById('pomo-display'),
          document.getElementById('pomo-toggle'),
          document.getElementById('pomo-reset')
        );

        this.startClock();
      }

      initUI() {
        // Theme init
        document.documentElement.setAttribute('data-theme', this.store.state.theme);
        
        // Notes init
        const notesEditor = document.getElementById('notes-editor');
        notesEditor.value = this.store.state.notes || "";
      }

      bindEvents() {
        // Theme Toggle
        document.getElementById('btn-theme').addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme');
          const next = current === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          this.store.state.theme = next;
          this.store.save();
        });

        // Sidebar & Overlay Toggle
        const sidebar = document.getElementById('app-sidebar');
        const overlay = document.getElementById('app-overlay');
        const toggleSidebar = () => {
          const isExpanded = sidebar.getAttribute('aria-expanded') === 'true';
          sidebar.setAttribute('aria-expanded', !isExpanded);
          overlay.classList.toggle('active', !isExpanded);
        };
        
        document.getElementById('btn-menu').addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', () => {
          sidebar.setAttribute('aria-expanded', 'false');
          overlay.classList.remove('active');
          // Also close expanded day cards
          document.querySelectorAll('.day-card.is-expanded').forEach(el => {
            el.classList.remove('is-expanded');
            el.querySelector('.btn-expand').textContent = '⛶';
          });
        });

        // Navigation (SPA Routing Simulator)
        document.querySelectorAll('.nav-item').forEach(btn => {
          btn.addEventListener('click', (e) => {
            // Update Nav State
            document.querySelectorAll('.nav-item').forEach(b => b.setAttribute('aria-selected', 'false'));
            btn.setAttribute('aria-selected', 'true');
            
            // Switch Views
            const targetId = btn.dataset.target;
            document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
            document.getElementById(targetId).classList.add('active');
            
            // Update Title
            document.getElementById('topbar-title').textContent = btn.textContent.trim().replace(/[📅📝]/g, '');
            
            // Close Sidebar on mobile
            if(window.innerWidth < 768) toggleSidebar();
          });
        });

        // Editor Debounce Save
        const notesStatus = document.getElementById('notes-status');
        const saveNotes = Utils.debounce((text) => {
          this.store.state.notes = text;
          this.store.save();
          notesStatus.textContent = 'Synced';
          notesStatus.classList.add('is-saved');
        }, 800);

        document.getElementById('notes-editor').addEventListener('input', (e) => {
          notesStatus.textContent = 'Saving...';
          notesStatus.classList.remove('is-saved');
          notesStatus.style.color = 'var(--text-tertiary)';
          saveNotes(e.target.value);
        });
      }

      startClock() {
        const clockEl = document.getElementById('live-clock');
        setInterval(() => {
          const now = new Date();
          clockEl.textContent = now.toLocaleTimeString('en-US', { hour12: false });
        }, 1000);
      }
    }

    // --- 6. BOOTSTRAP ---
    document.addEventListener('DOMContentLoaded', () => {
      new App();
    });

  </script>
</body>
