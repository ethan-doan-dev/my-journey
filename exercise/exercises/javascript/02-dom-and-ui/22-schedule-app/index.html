<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Schedule App</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        min-height: 100vh;
        overflow-x: hidden;
        font-family: Arial, sans-serif;
      }

      .sidebar {
        width: 260px;
        background-color: #f4f2f2;
        transition: margin-left 0.3s ease;
      }

      .sidebar.hidden {
        margin-left: -260px;
      }

      .header-bar {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .toggle-btn {
        padding: 2px 4px;
        font-size: 12px;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 4px;
        background-color: #fff;
      }

      .schedule-logo {
        font-weight: bold;
        font-size: 30px;
        letter-spacing: 1px;
        color: #000;
      }

      .main-content {
        flex: 1;
        background-color: #ffffff;
        padding: 30px;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .container {
        width: 100%;
        display: flex;
        margin: 40px auto 0;
        gap: 15px;
        overflow-x: auto;
        padding-bottom: 10px;
      }

      .day-column {
        flex: 1;
        min-width: 160px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        background-color: #f9f9f9;
        display: flex;
        flex-direction: column;
        transition: all 0.3s ease;
      }

      .day-header {
        font-weight: bold;
        padding: 12px;
        border-bottom: 1px solid #e0e0e0;
        background-color: #f1f1f1;
        border-top-left-radius: 8px;
        border-top-right-radius: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .day-content {
        padding: 12px;
        flex: 1;
        min-height: 700px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .add-task-box {
        display: flex;
        gap: 5px;
      }

      .task-input {
        flex: 1;
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 13px;
        outline: none;
      }

      .task-input:focus {
        border-color: #007bff;
      }

      .add-btn {
        padding: 6px 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }

      .add-btn:hover {
        background-color: #0056b3;
      }

      .task-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .task-item {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #fff;
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #e2e2e2;
        word-break: break-word;
      }

      .task-checkbox {
        cursor: pointer;
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .task-text {
        font-size: 14px;
        color: #333;
        transition: all 0.2s ease;
      }

      .task-item.completed .task-text {
        text-decoration: line-through;
        color: #888;
      }

      .delete-btn {
        background: transparent;
        border: none;
        color: #999;
        font-size: 16px;
        cursor: pointer;
        margin-left: auto;
        padding: 0 4px;
        line-height: 1;
        transition: color 0.2s ease;
      }

      .delete-btn:hover {
        color: #dc3545;
      }

      .expand-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 16px;
        color: #666;
        transition: color 0.2s;
        padding: 0 4px;
      }

      .expand-btn:hover {
        color: #000;
      }

      .overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.6);
        z-index: 998;
      }
      .overlay.active {
        display: block;
      }

      .day-column.expanded {
        position: fixed;
        top: 5vh;
        left: 50%;
        transform: translateX(-50%);
        width: 90vw;
        max-width: 1000px;
        height: 90vh;
        z-index: 999;
        box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        overflow-y: auto;
      }
      .day-column.expanded .day-content {
        min-height: auto;
      }

      .workspace-area {
        display: none;
        flex-direction: column;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 2px dashed #ccc;
        flex: 1; 
      }
      .day-column.expanded .workspace-area {
        display: flex;
      }

      .workspace-area h4 {
        margin-bottom: 10px;
        color: #333;
      }

      .workspace-textarea {
        flex: 1;
        min-height: 250px;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-family: inherit;
        font-size: 14px;
        resize: vertical;
        outline: none;
      }
      .workspace-textarea:focus {
        border-color: #007bff;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar" id="sidebar"></aside>
    
    <div class="overlay" id="overlay"></div>

    <main class="main-content">
      <div class="header-bar">
        <button class="toggle-btn" id="toggleBtn">☰</button>
        <div class="schedule-logo">SCHEDULE</div>
      </div>

      <div class="container">
        <div class="day-column">
          <div class="day-header">Monday</div>
          <div class="day-content">
            <div class="add-task-box">
              <input type="text" class="task-input" placeholder="+ add task..." />
              <button class="add-btn">+</button>
            </div>
            <ul class="task-list"></ul>
          </div>
        </div>

        <div class="day-column">
          <div class="day-header">Tuesday</div>
          <div class="day-content">
            <div class="add-task-box">
              <input type="text" class="task-input" placeholder="+ add task..." />
              <button class="add-btn">+</button>
            </div>
            <ul class="task-list"></ul>
          </div>
        </div>

        <div class="day-column">
          <div class="day-header">Wednesday</div>
          <div class="day-content">
            <div class="add-task-box">
              <input type="text" class="task-input" placeholder="+ add task..." />
              <button class="add-btn">+</button>
            </div>
            <ul class="task-list"></ul>
          </div>
        </div>

        <div class="day-column">
          <div class="day-header">Thursday</div>
          <div class="day-content">
            <div class="add-task-box">
              <input type="text" class="task-input" placeholder="+ add task..." />
              <button class="add-btn">+</button>
            </div>
            <ul class="task-list"></ul>
          </div>
        </div>

        <div class="day-column">
          <div class="day-header">Friday</div>
          <div class="day-content">
            <div class="add-task-box">
              <input type="text" class="task-input" placeholder="+ add task..." />
              <button class="add-btn">+</button>
            </div>
            <ul class="task-list"></ul>
          </div>
        </div>

        <div class="day-column">
          <div class="day-header">Saturday</div>
          <div class="day-content">
            <div class="add-task-box">
              <input type="text" class="task-input" placeholder="+ add task..." />
              <button class="add-btn">+</button>
            </div>
            <ul class="task-list"></ul>
          </div>
        </div>

        <div class="day-column">
          <div class="day-header">Sunday</div>
          <div class="day-content">
            <div class="add-task-box">
              <input type="text" class="task-input" placeholder="+ add task..." />
              <button class="add-btn">+</button>
            </div>
            <ul class="task-list"></ul>
          </div>
        </div>
      </div>

     <script>
      const toggleBtn = document.getElementById('toggleBtn');
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');

      toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('hidden');
      });

      overlay.addEventListener('click', () => {
        document.querySelectorAll('.day-column.expanded').forEach(col => {
          col.classList.remove('expanded');
          col.querySelector('.expand-btn').innerHTML = '⛶';
        });
        overlay.classList.remove('active');
      });

      function saveData() {
        const scheduleData = {};
        
        document.querySelectorAll('.day-column').forEach((column) => {
          const dayName = column.querySelector('.day-header span').innerText;
          const tasks = [];
          
          column.querySelectorAll('.task-item').forEach((item) => {
            tasks.push({
              text: item.querySelector('.task-text').innerText,
              completed: item.querySelector('.task-checkbox').checked
            });
          });
          
          const workspaceText = column.querySelector('.workspace-textarea').value;

          scheduleData[dayName] = {
            tasks: tasks,
            workspaceText: workspaceText
          };
        });

        localStorage.setItem('myScheduleApp', JSON.stringify(scheduleData));
      }

      function createTaskElement(taskText, isCompleted, taskList) {
        const li = document.createElement('li');
        li.className = 'task-item';
        if (isCompleted) li.classList.add('completed');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'task-checkbox';
        checkbox.checked = isCompleted;

        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = taskText;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.innerHTML = '&times;';
        deleteBtn.title = 'delete task';

        deleteBtn.addEventListener('click', () => {
          li.remove();
          saveData();
        });

        checkbox.addEventListener('change', () => {
          li.classList.toggle('completed', checkbox.checked);
          saveData();
        });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteBtn);
        taskList.appendChild(li);
      }

      function initApp() {
        const savedData = JSON.parse(localStorage.getItem('myScheduleApp')) || {};

        document.querySelectorAll('.day-column').forEach((column) => {
          const header = column.querySelector('.day-header');
          const dayName = header.innerText;
          
          header.innerHTML = `<span>${dayName}</span>`;
          const expandBtn = document.createElement('button');
          expandBtn.className = 'expand-btn';
          expandBtn.innerHTML = '⛶';
          expandBtn.title = "zoom in";
          header.appendChild(expandBtn);

          const dayContent = column.querySelector('.day-content');
          const workspace = document.createElement('div');
          workspace.className = 'workspace-area';
          workspace.innerHTML = `
            <h4>workspace</h4>
            <textarea class="workspace-textarea" placeholder="Enter workspace notes here..."></textarea>
          `;
          dayContent.appendChild(workspace);

          const input = column.querySelector('.task-input');
          const addBtn = column.querySelector('.add-btn');
          const taskList = column.querySelector('.task-list');
          const textarea = workspace.querySelector('.workspace-textarea');

          if (savedData[dayName]) {
            const dayData = savedData[dayName];
            const tasks = Array.isArray(dayData) ? dayData : (dayData.tasks || []);
            const workspaceText = dayData.workspaceText || "";

            tasks.forEach(task => {
              createTaskElement(task.text, task.completed, taskList);
            });
            textarea.value = workspaceText;
          }

          textarea.addEventListener('input', () => {
            saveData();
          });

          expandBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isExpanded = column.classList.contains('expanded');
            
            document.querySelectorAll('.day-column.expanded').forEach(col => {
              col.classList.remove('expanded');
              col.querySelector('.expand-btn').innerHTML = '⛶';
            });

            if (!isExpanded) {
              column.classList.add('expanded');
              expandBtn.innerHTML = '✖';
              overlay.classList.add('active');
            } else {
              overlay.classList.remove('active');
            }
          });

          function addTask() {
            const taskText = input.value.trim();
            if (!taskText) return;

            createTaskElement(taskText, false, taskList);
            input.value = ''; 
            saveData();
          }

          addBtn.addEventListener('click', addTask);
          input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
          });
        });
      }

      initApp();
    </script>
    </main>
  </body>
</html>
