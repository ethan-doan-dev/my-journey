<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Schedule App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      overflow-x: hidden;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      height: 100vh;
      background: #f4f2f2;
      z-index: 1001;
      transform: translateX(0);
      transition: transform 0.3s ease;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: 20px 15px;
      border-right: 1px solid #e0e0e0;
    }

    .sidebar.hidden {
      transform: translateX(-100%);
    }

    .sidebar-header {
      padding-bottom: 15px;
      border-bottom: 1px solid #e0e0e0;
      margin-bottom: 15px;
    }

    .sidebar-logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #1a1a1a;
      text-transform: uppercase;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
    }

    .sidebar-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #777;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .notebook-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .notebook-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #444;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .notebook-item:hover {
      background: #e8e6e6;
      color: #000;
    }

    .notebook-item.active {
      background: #e0eafc;
      color: #007bff;
      font-weight: 700;
    }

    .sidebar-footer {
      padding-top: 15px;
      border-top: 1px solid #e0e0e0;
      margin-top: auto;
    }

    .switch-notebook-btn {
      width: 100%;
      padding: 11px 12px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .switch-notebook-btn:hover {
      background: #007bff;
      color: #fff;
      border-color: #007bff;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1000;
    }

    .overlay.active {
      display: block;
    }

    .main-content {
      width: 100%;
      min-height: 100vh;
      padding: 25px;
      background: #fff;
      display: flex;
      flex-direction: column;
      transition: margin-left 0.3s ease, width 0.3s ease;
    }

    @media (min-width: 769px) {
      .sidebar:not(.hidden) ~ .main-content {
        margin-left: 260px;
        width: calc(100% - 260px);
      }
    }

    .header-bar {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .toggle-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      font-size: 18px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }

    .toggle-btn:active {
      transform: scale(0.95);
    }

    .schedule-logo {
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 1px;
      color: #000;
    }

    .container {
      width: 100%;
      display: flex;
      gap: 15px;
      margin: 40px auto 0;
      padding-bottom: 10px;
      overflow-x: auto;
    }

    .day-column {
      flex: 1;
      min-width: 160px;
      display: flex;
      flex-direction: column;
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      font-weight: 700;
      background: #f1f1f1;
      border-bottom: 1px solid #e0e0e0;
      border-radius: 8px 8px 0 0;
    }

    .day-name {
      font-size: 15px;
    }

    .day-content {
      flex: 1;
      min-height: 700px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
    }

    .add-task-box {
      display: flex;
      gap: 5px;
    }

    .task-input {
      flex: 1;
      min-width: 0;
      height: 36px;
      padding: 6px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      outline: none;
    }

    .task-input:focus {
      border-color: #007bff;
    }

    .add-btn {
      width: 38px;
      height: 36px;
      flex-shrink: 0;
      border: 0;
      border-radius: 5px;
      background: #007bff;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .add-btn:active {
      transform: scale(0.95);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px;
      background: #fff;
      border: 1px solid #e2e2e2;
      border-radius: 5px;
      word-break: break-word;
    }

    .task-checkbox {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .task-text {
      font-size: 14px;
      line-height: 1.4;
      color: #333;
    }

    .task-item.completed .task-text {
      color: #888;
      text-decoration: line-through;
    }

    .delete-btn {
      width: 28px;
      height: 28px;
      margin-left: auto;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #999;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background: #f5f5f5;
      color: #dc3545;
    }

    .expand-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #666;
      font-size: 17px;
      cursor: pointer;
    }

    .expand-btn:hover {
      background: #e5e5e5;
    }

    .expand-btn:active {
      transform: scale(0.9);
    }

    .day-column.expanded {
      position: fixed;
      top: 5vh;
      left: 50%;
      width: 90vw;
      max-width: 1000px;
      height: 90vh;
      transform: translateX(-50%);
      z-index: 1002;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .day-column.expanded .day-content {
      min-height: auto;
    }

    .workspace-area {
      display: none;
      flex: 1;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px dashed #ccc;
    }

    .day-column.expanded .workspace-area {
      display: flex;
    }

    .workspace-area h4 {
      color: #333;
    }

    .workspace-textarea {
      width: 100%;
      flex: 1;
      min-height: 250px;
      padding: 12px;
      font-size: 14px;
      line-height: 1.5;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      resize: vertical;
    }

    .workspace-textarea:focus {
      border-color: #007bff;
    }

    @media (max-width: 768px) {
      .main-content {
        padding: 15px;
      }

      .schedule-logo {
        font-size: 24px;
      }

      .container {
        flex-direction: column;
        gap: 15px;
        margin-top: 20px;
        overflow-x: hidden;
      }

      .day-column {
        width: 100%;
        min-width: 0;
      }

      .day-content {
        min-height: auto;
      }

      .sidebar {
        width: 280px;
      }

      .day-column.expanded {
        top: 2.5vh;
        width: 95vw;
        height: 95vh;
      }

      .task-input {
        height: 42px;
        font-size: 16px;
      }

      .add-btn {
        width: 42px;
        height: 42px;
      }

      .task-checkbox {
        width: 20px;
        height: 20px;
      }

      .delete-btn,
      .expand-btn {
        width: 36px;
        height: 36px;
      }

      .workspace-textarea {
        min-height: 150px;
        font-size: 16px;
      }
    }

    @media (max-width: 400px) {
      .main-content {
        padding: 10px;
      }

      .schedule-logo {
        font-size: 21px;
      }

      .day-header,
      .day-content {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar hidden" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">LAB</div>
    </div>
    
    <div class="sidebar-content">
      <div class="sidebar-section-title">Notebooks</div>
      <ul class="notebook-list">
        <li class="notebook-item active">
          <span>📅</span> Current Week Schedule
        </li>
        <li class="notebook-item">
          <span>📝</span> Work Notes
        </li>
        <li class="notebook-item">
          <span>💡</span> Project Ideas
        </li>
      </ul>
    </div>

    <div class="sidebar-footer">
      <button class="switch-notebook-btn" id="switchNotebookBtn" type="button">
        <span>🔄</span> Switch Notebook
      </button>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main-content">
    <div class="header-bar">
      <button class="toggle-btn" id="toggleBtn" type="button">☰</button>
      <div class="schedule-logo">SCHEDULE</div>
    </div>

    <div class="container">
      <div class="day-column">
        <div class="day-header">
          <span class="day-name">Monday</span>
        </div>
        <div class="day-content">
          <div class="add-task-box">
            <input type="text" class="task-input" placeholder="+ add task..." />
            <button class="add-btn" type="button">+</button>
          </div>
          <ul class="task-list"></ul>
        </div>
      </div>
      <div class="day-column">
        <div class="day-header">
          <span class="day-name">Tuesday</span>
        </div>
        <div class="day-content">
          <div class="add-task-box">
            <input type="text" class="task-input" placeholder="+ add task..." />
            <button class="add-btn" type="button">+</button>
          </div>
          <ul class="task-list"></ul>
        </div>
      </div>
      <div class="day-column">
        <div class="day-header">
          <span class="day-name">Wednesday</span>
        </div>
        <div class="day-content">
          <div class="add-task-box">
            <input type="text" class="task-input" placeholder="+ add task..." />
            <button class="add-btn" type="button">+</button>
          </div>
          <ul class="task-list"></ul>
        </div>
      </div>
      <div class="day-column">
        <div class="day-header">
          <span class="day-name">Thursday</span>
        </div>
        <div class="day-content">
          <div class="add-task-box">
            <input type="text" class="task-input" placeholder="+ add task..." />
            <button class="add-btn" type="button">+</button>
          </div>
          <ul class="task-list"></ul>
        </div>
      </div>
      <div class="day-column">
        <div class="day-header">
          <span class="day-name">Friday</span>
        </div>
        <div class="day-content">
          <div class="add-task-box">
            <input type="text" class="task-input" placeholder="+ add task..." />
            <button class="add-btn" type="button">+</button>
          </div>
          <ul class="task-list"></ul>
        </div>
      </div>
      <div class="day-column">
        <div class="day-header">
          <span class="day-name">Saturday</span>
        </div>
        <div class="day-content">
          <div class="add-task-box">
            <input type="text" class="task-input" placeholder="+ add task..." />
            <button class="add-btn" type="button">+</button>
          </div>
          <ul class="task-list"></ul>
        </div>
      </div>
      <div class="day-column">
        <div class="day-header">
          <span class="day-name">Sunday</span>
        </div>
        <div class="day-content">
          <div class="add-task-box">
            <input type="text" class="task-input" placeholder="+ add task..." />
            <button class="add-btn" type="button">+</button>
          </div>
          <ul class="task-list"></ul>
        </div>
      </div>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "myScheduleApp";
    const toggleBtn = document.getElementById("toggleBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const switchNotebookBtn = document.getElementById("switchNotebookBtn");

    function closeExpandedDays() {
      document.querySelectorAll(".day-column.expanded").forEach((column) => {
        column.classList.remove("expanded");
        const button = column.querySelector(".expand-btn");
        if (button) {
          button.textContent = "⛶";
        }
      });
    }

    function closeSidebar() {
      sidebar.classList.add("hidden");
    }

    function openSidebar() {
      sidebar.classList.remove("hidden");
      if (window.innerWidth <= 768) {
        overlay.classList.add("active");
      }
    }

    function closeOverlay() {
      closeExpandedDays();
      if (window.innerWidth <= 768) {
        closeSidebar();
      }
      overlay.classList.remove("active");
    }

    function saveData() {
      const scheduleData = {};
      document.querySelectorAll(".day-column").forEach((column) => {
        const dayName = column.querySelector(".day-name")?.textContent;
        if (!dayName) {
          return;
        }

        const tasks = Array.from(
          column.querySelectorAll(".task-item")
        ).map((item) => ({
          text: item.querySelector(".task-text")?.textContent || "",
          completed: item.querySelector(".task-checkbox")?.checked || false
        }));

        const textarea = column.querySelector(".workspace-textarea");

        scheduleData[dayName] = {
          tasks,
          workspaceText: textarea ? textarea.value : ""
        };
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(scheduleData));
    }

    function createTaskElement(task, taskList) {
      const li = document.createElement("li");
      li.className = "task-item";

      if (task.completed) {
        li.classList.add("completed");
      }

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "task-checkbox";
      checkbox.checked = task.completed;

      const text = document.createElement("span");
      text.className = "task-text";
      text.textContent = task.text;

      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "delete-btn";
      deleteBtn.textContent = "×";
      deleteBtn.setAttribute("aria-label", "Delete task");

      deleteBtn.addEventListener("click", () => {
        li.remove();
        saveData();
      });

      checkbox.addEventListener("change", () => {
        li.classList.toggle("completed", checkbox.checked);
        saveData();
      });

      li.append(checkbox, text, deleteBtn);
      taskList.appendChild(li);
    }

    function addWorkspace(column) {
      const dayContent = column.querySelector(".day-content");
      const workspace = document.createElement("div");
      workspace.className = "workspace-area";

      workspace.innerHTML = `
        <h4>Workspace</h4>
        <textarea
          class="workspace-textarea"
          placeholder="Enter workspace notes here..."
        ></textarea>
      `;

      dayContent.appendChild(workspace);
      const textarea = workspace.querySelector(".workspace-textarea");
      textarea.addEventListener("input", saveData);
    }

    function setupDayColumn(column, savedData) {
      const dayName = column.querySelector(".day-name").textContent;
      const taskList = column.querySelector(".task-list");
      const input = column.querySelector(".task-input");
      const addBtn = column.querySelector(".add-btn");
      const header = column.querySelector(".day-header");

      addWorkspace(column);

      const expandBtn = document.createElement("button");
      expandBtn.type = "button";
      expandBtn.className = "expand-btn";
      expandBtn.textContent = "⛶";
      expandBtn.setAttribute("aria-label", `Expand ${dayName}`);

      header.appendChild(expandBtn);

      const dayData = savedData[dayName];

      if (dayData) {
        const tasks = Array.isArray(dayData) ? dayData : dayData.tasks || [];
        tasks.forEach((task) => {
          createTaskElement(task, taskList);
        });

        const textarea = column.querySelector(".workspace-textarea");
        textarea.value = Array.isArray(dayData) ? "" : dayData.workspaceText || "";
      }

      expandBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        const isExpanded = column.classList.contains("expanded");
        closeExpandedDays();

        if (!isExpanded) {
          column.classList.add("expanded");
          expandBtn.textContent = "×";
          overlay.classList.add("active");
        } else {
          if (window.innerWidth <= 768 && !sidebar.classList.contains("hidden")) {
            overlay.classList.add("active");
          } else {
            overlay.classList.remove("active");
          }
        }
      });

      function addTask() {
        const text = input.value.trim();
        if (!text) {
          return;
        }

        createTaskElement(
          {
            text,
            completed: false
          },
          taskList
        );

        input.value = "";
        input.focus();
        saveData();
      }

      addBtn.addEventListener("click", addTask);

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          addTask();
        }
      });
    }

    function initApp() {
      let savedData = {};

      try {
        savedData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch {
        savedData = {};
      }

      document.querySelectorAll(".day-column").forEach((column) => {
        setupDayColumn(column, savedData);
      });

      if (window.innerWidth <= 768) {
        sidebar.classList.add("hidden");
      } else {
        sidebar.classList.remove("hidden");
      }
    }

    toggleBtn.addEventListener("click", () => {
      const isHidden = sidebar.classList.contains("hidden");
      if (isHidden) {
        openSidebar();
      } else {
        closeSidebar();
        if (window.innerWidth <= 768) {
          overlay.classList.remove("active");
        }
      }
    });

    switchNotebookBtn.addEventListener("click", () => {
      alert("Switch notebook feature is under development!");
    });

    overlay.addEventListener("click", closeOverlay);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeOverlay();
      }
    });

    window.addEventListener("resize", () => {
      if (window.innerWidth > 768) {
        overlay.classList.remove("active");
      } else {
        if (!sidebar.classList.contains("hidden")) {
          overlay.classList.add("active");
        }
      }
    });

    initApp();
  </script>
</body>
</html>
